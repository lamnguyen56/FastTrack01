# Pi 3B SPI0 and MCP2515: built-in to avoid missing module packages.
CONFIG_SPI=y
CONFIG_SPI_BCM2835=y
CONFIG_CAN=y
CONFIG_CAN_RAW=y
CONFIG_CAN_DEV=y
CONFIG_CAN_CALC_BITTIMING=y
CONFIG_CAN_MCP251X=y

# Pi 3B USB host, mass storage and FAT32 filesystem support.
CONFIG_USB=y
CONFIG_USB_DWCOTG=y
CONFIG_SCSI=y
CONFIG_BLK_DEV_SD=y
CONFIG_USB_STORAGE=y
CONFIG_FAT_FS=y
CONFIG_VFAT_FS=y
CONFIG_NLS=y
CONFIG_NLS_CODEPAGE_437=y
CONFIG_NLS_ISO8859_1=y
CONFIG_NLS_UTF8=y

# Planned POSIX message-queue IPC; current daemons still use UDS/files.
CONFIG_POSIX_MQUEUE=y

# Pi 3 stateful V4L2 hardware codec over VideoCore MMAL/VCHIQ.
CONFIG_STAGING=y
CONFIG_BCM_VIDEOCORE=y
CONFIG_MEDIA_SUPPORT=m
CONFIG_MEDIA_CONTROLLER=y
CONFIG_VIDEO_DEV=m
CONFIG_VIDEO_CODEC_BCM2835=m
CONFIG_BCM2835_VCHIQ=y
CONFIG_BCM2835_VCHIQ_MMAL=m
CONFIG_BCM_VC_SM_CMA=m
