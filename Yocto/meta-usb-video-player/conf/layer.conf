# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-usb-video-player"
BBFILE_PATTERN_meta-usb-video-player = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-usb-video-player = "10"

LAYERDEPENDS_meta-usb-video-player = "core openembedded-layer qt5-layer"
LAYERSERIES_COMPAT_meta-usb-video-player = "scarthgap"
