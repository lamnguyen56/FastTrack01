# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-fasttrack"
BBFILE_PATTERN_meta-fasttrack = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-fasttrack = "10"

LAYERDEPENDS_meta-fasttrack = "core openembedded-layer qt5-layer"
LAYERSERIES_COMPAT_meta-fasttrack = "kirkstone"
