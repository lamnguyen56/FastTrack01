# Vietnam regulatory domain. Change this when operating in another country.
country=VN
ctrl_interface=/run/wpa_supplicant
update_config=0

# Fill in the actual 2.4 GHz WPA2-Personal AP before enabling this network.
# Never commit real Wi-Fi credentials to the repository.
network={
    ssid="CHANGE_ME"
    psk="CHANGE_ME_PASSWORD"
    key_mgmt=WPA-PSK
    disabled=1
}
