<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="940" viewBox="0 0 1200 940" role="img" aria-labelledby="title desc">
<title id="title">FastTrack01 — Software blocks</title>
<desc id="desc">CANoe sends commands through SocketCAN to the Qt application. USB monitoring and scanning supply a playlist. The player controller coordinates QML and Qt Multimedia. Status returns to CANoe. Yocto builds the Linux target image.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker></defs>
<style>text{font-family:Arial,sans-serif;fill:#172b44;font-size:17px}.heading{font-size:28px;font-weight:bold}.label{font-size:20px;font-weight:bold}.small{font-size:15px}.box{fill:#fff;stroke:#64748b;stroke-width:1.5;rx:12}.flow{fill:none;stroke:#475569;stroke-width:2;marker-end:url(#arrow)}.status{fill:none;stroke:#16756a;stroke-width:2;stroke-dasharray:7 5;marker-end:url(#arrow)}</style>
<rect width="1200" height="940" fill="#f5f8fc"/>
<text x="40" y="45" class="heading">FastTrack01 · USB Video Player controlled via CAN</text>
<text x="40" y="76">Proposed architecture · Qt5 / QML · Yocto Scarthgap · Linux target</text>
<rect x="30" y="105" width="1140" height="115" rx="14" fill="#e6eefb"/>
<rect class="box" x="50" y="125" width="280" height="75"/><text x="70" y="153" class="label">CANoe + DBC + CAPL</text><text x="70" y="180">Commands / status / test cases</text>
<rect class="box" x="480" y="125" width="270" height="75"/><text x="500" y="153" class="label">CAN hardware</text><text x="500" y="180">Adapter · bus · target controller</text>
<rect class="box" x="880" y="125" width="270" height="75"/><text x="900" y="153" class="label">USB storage</text><text x="900" y="180">Video files and directories</text>
<path class="flow" d="M330 148 H480"/><path class="status" d="M480 184 H330"/>
<rect x="30" y="245" width="1140" height="565" rx="14" fill="#e8f4ef"/>
<text x="50" y="277" class="label">LINUX TARGET — Raspberry Pi / selected BSP</text>
<rect class="box" x="50" y="300" width="320" height="95"/><text x="70" y="329" class="label">CAN platform</text><text x="70" y="356">Device Tree + kernel CAN driver</text><text x="70" y="380">SocketCAN / can0 configuration</text>
<rect class="box" x="830" y="300" width="320" height="95"/><text x="850" y="329" class="label">USB platform</text><text x="850" y="356">USB storage + filesystem driver</text><text x="850" y="380">udev → mount service</text>
<path class="flow" d="M615 200 V235 H210 V300"/><path class="flow" d="M1015 200 V300"/>
<rect class="box" x="50" y="440" width="320" height="100"/><text x="70" y="470" class="label">CanService + protocol codec</text><text x="70" y="497">Validate / decode command frames</text><text x="70" y="521">Encode and send player status</text>
<rect class="box" x="830" y="440" width="320" height="100"/><text x="850" y="470" class="label">UsbMonitor + MediaScanner</text><text x="850" y="497">Mount events / recursive file scan</text><text x="850" y="521">PlaylistModel / USB removal</text>
<path class="flow" d="M210 395 V440"/><path class="flow" d="M990 395 V440"/>
<rect class="box" x="420" y="440" width="360" height="120"/><text x="440" y="472" class="label">PlayerController (C++)</text><text x="440" y="500">Single command entry / state machine</text><text x="440" y="526">Track selection / seek / error policy</text><text x="440" y="548" class="small">Shared by local UI and CAN commands</text>
<path class="flow" d="M370 474 H420"/><path class="status" d="M420 524 H370"/><path class="flow" d="M830 489 H780"/>
<rect class="box" x="50" y="630" width="320" height="130"/><text x="70" y="662" class="label">QML HMI</text><text x="70" y="690">VideoOutput / playlist / controls</text><text x="70" y="717">Progress / USB and error messages</text><text x="70" y="744">Touch / mouse → controller</text>
<rect class="box" x="420" y="630" width="360" height="130"/><text x="440" y="662" class="label">PlaybackEngine</text><text x="440" y="690">Qt Multimedia / QMediaPlayer</text><text x="440" y="717">GStreamer demux / decode / audio</text><text x="440" y="744">Position / duration / media errors</text>
<rect class="box" x="830" y="630" width="320" height="130"/><text x="850" y="662" class="label">Target output</text><text x="850" y="690">Graphics backend → display</text><text x="850" y="717">Audio backend → speaker</text><text x="850" y="744">HW / SW decode: verify on target</text>
<path class="flow" d="M490 560 V590 H210 V630"/><path class="flow" d="M600 560 V630"/><path class="flow" d="M780 694 H830"/><path class="flow" d="M420 694 H370"/>
